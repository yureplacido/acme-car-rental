name: acme-car-rental

# Este arquivo vive em others/ (assets não-Java). Rode os comandos a partir de
# others/ (cd others && docker compose up ...) para o compose resolver o .env,
# os volumes (./swagger, ./traefik, ./keycloak) e os build contexts (../<módulo>).
# ──────────────────────────────────────────────────────────────────────────
# Perfis do compose — cada serviço participa do seu grupo E do perfil "all":
#
#   infra:      traefik + swagger   → subir só o agregador:
#   services:   aplicacoes              docker compose up -d --profile infra
#   databases:  bancos (ch.7)      → apps + bancos + kafka:
#   identity:   keycloak + postgres    docker compose up -d --profile services
#   all:        tudo               → só bancos: docker compose up -d --profile databases
#                                  → tudo: docker compose up -d --profile all
#
# Kafka (cap.9) entra no perfil services/all: broker KRaft + kafka-init provê os
# tópicos de messaging antes de inventory/billing iniciarem.
#
# Bancos pertencem a `services` E `databases`: --profile services sobe apps com
# seus bancos (respeitando o depends_on); --profile databases sobe so os bancos.
#
# com portas de traefik/swagger e keycloak fixas, os servicos podem rodar no
# host (IntelliJ/dev mode) e o agregador continua enxergando via
# host.docker.internal:<porta>.
# ──────────────────────────────────────────────────────────────────────────

services:

  traefik:
    image: traefik:v3.3
    container_name: acme-traefik
    restart: unless-stopped
    profiles: ["infra", "all"]
    env_file:
      - .env
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --log.level=INFO
    ports:
      - "${GATEWAY_PORT:-8090}:80"
      - "${DASHBOARD_PORT:-8095}:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  swagger:
    image: nginx:1.27-alpine
    container_name: acme-swagger
    restart: unless-stopped
    profiles: ["infra", "all"]
    volumes:
      - ./swagger:/usr/share/nginx/html:ro

  # ---------------- services ----------------

  users-service:
    profiles: ["services", "all"]
    build:
      context: ../users-service
      dockerfile: Dockerfile
    container_name: users-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${USER_SERVICE_PORT:-8080}:${USER_SERVICE_PORT:-8080}"

  reservation-service:
    profiles: ["services", "all"]
    build:
      context: ../reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${RESERVATION_PORT:-8081}:${RESERVATION_PORT:-8081}"
    depends_on:
      reservation-postgres:
        condition: service_healthy

  rental-service:
    profiles: ["services", "all"]
    build:
      context: ../rental-service
      dockerfile: Dockerfile
    container_name: rental-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${RENTAL_PORT:-8082}:${RENTAL_PORT:-8082}"
    depends_on:
      rental-mongo:
        condition: service_healthy

  inventory-service:
    profiles: ["services", "all"]
    build:
      # Contexto RAIZ do repositório: o Dockerfile multi-modulo compila o contrato
      # inventory-proto (schema-first) antes do servico. O .dockerignore da raiz
      # restringe o contexto a inventory-proto/ + inventory-service/.
      context: ..
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${INVENTORY_PORT:-8083}:${INVENTORY_PORT:-8083}"
    depends_on:
      inventory-mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  billing-service:
    profiles: ["services", "all"]
    build:
      context: ../billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${BILLING_PORT:-8084}:${BILLING_PORT:-8084}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------------- databases ----------------

  # Cap.7 - bancos dos servicos (perfil databases). Na rede default do compose,
  # alcancaveis pelos servicos pelo nome do container (connection-string %docker).

  reservation-postgres:
    container_name: acme-reservation-postgres
    image: docker.io/library/postgres:14
    restart: always
    profiles: ["databases", "services", "all"]
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-mysql:
    container_name: acme-inventory-mysql
    image: docker.io/library/mysql:8.4
    restart: always
    profiles: ["databases", "services", "all"]
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  rental-mongo:
    container_name: acme-rental-mongo
    image: docker.io/library/mongo:7
    restart: always
    profiles: ["databases", "services", "all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- messaging ----------------

  # Cap.9 - Kafka KRaft single-node. Na rede default do compose, os serviços
  # resolvem `kafka` pelo nome (kafka.bootstrap.servers %docker) no porto 9092.
  # Ferramentas no host usam docker exec (ex.: docker exec acme-kafka kafka-topics.sh
  # --bootstrap-server kafka:9092 ...). auto-create desligado: os tópicos de
  # messaging são provisionados via kafka-init (ADR 002 — retry não é mecanismo
  # de criação automática de recursos).

  kafka:
    container_name: acme-kafka
    image: apache/kafka:3.9.1
    restart: unless-stopped
    profiles: ["services", "all"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Provisiona os tópicos de messaging antes dos serviços iniciarem
  # (one-shot; inventory/billing dependem de service_completed_successfully).
  kafka-init:
    container_name: acme-kafka-init
    image: apache/kafka:3.9.1
    restart: "no"
    profiles: ["services", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for t in \
          vehicle-registered \
          vehicle-registered-retry_1000 \
          vehicle-registered-retry_5000 \
          vehicle-registered-retry_15000; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done
        echo "messaging topics provisioned"

  # ---------------- identity ----------------

  # Cap.6.4 - Keycloak + PostgreSQL (perfil identity). Na rede default para que
  # os servicos resolvam `keycloak` pelo nome (auth-server-url %docker).

  postgres:
    container_name: acme-postgres
    image: docker.io/library/postgres:14
    restart: always
    profiles: ["identity", "all"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    container_name: acme-keycloak
    image: quay.io/keycloak/keycloak:25.0.6
    restart: always
    profiles: ["identity", "all"]
    volumes:
      - "./keycloak/car-rental-realm.json:/opt/keycloak/data/import/car-rental-realm.json:ro"
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "${KEYCLOAK_PORT:-7777}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
