quarkus.http.host=0.0.0.0
quarkus.http.port=${BILLING_PORT:8084}
quarkus.swagger-ui.always-include=true
# OpenAPI no prefixo do gateway (traefik encaminha sem strip) p/ o agregador.
quarkus.smallrye-openapi.path=/billing/q/openapi
# Cap.9 - Kafka consumer: Billing reacts to Inventory integration events.
kafka.bootstrap.servers=localhost:9092
%docker.kafka.bootstrap.servers=kafka:9092
%prod.kafka.bootstrap.servers=localhost:9092

mp.messaging.incoming.vehicle-registered-in.connector=smallrye-kafka
mp.messaging.incoming.vehicle-registered-in.topic=vehicle-registered
mp.messaging.incoming.vehicle-registered-in.group.id=billing-service
mp.messaging.incoming.vehicle-registered-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.vehicle-registered-in.auto.offset.reset=earliest

# Cap.9 - Retry de processamento: redelivery não bloqueante via retry topics.
mp.messaging.incoming.vehicle-registered-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.topics=vehicle-registered-retry_1000,vehicle-registered-retry_5000,vehicle-registered-retry_15000
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.timeout=30000
