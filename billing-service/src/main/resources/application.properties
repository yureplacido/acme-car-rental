quarkus.http.host=0.0.0.0
quarkus.http.port=${BILLING_PORT:8084}
# Teste (@QuarkusTest) em porta aleatória: isola do dev (8084) e evita colisão entre execuções.
%test.quarkus.http.test-port=0
quarkus.swagger-ui.always-include=true
# OpenAPI no prefixo do gateway (traefik encaminha sem strip) p/ o agregador.
quarkus.smallrye-openapi.path=/billing/q/openapi

# Cap.9 (fluxo de cobrança, ADR 005) - billing ganha datasource PostgreSQL para o
# inbox durável e persistência real de invoice. Sem URL em dev/test: Dev Services
# sobe um Postgres zerado em container (mesmo padrão do reservation-service).
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/billing
%prod.quarkus.datasource.username=billing
%prod.quarkus.datasource.password=billing
%docker.quarkus.datasource.reactive.url=vertx-reactive:postgresql://billing-postgres:5432/billing
%docker.quarkus.datasource.username=billing
%docker.quarkus.datasource.password=billing
quarkus.hibernate-orm.database.generation=drop-and-create
# Testes de persistência: força Dev Services PostgreSQL e criação do schema no perfil test.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Cap.9 - Kafka consumer: Billing reacts to Inventory integration events.
kafka.bootstrap.servers=localhost:9092
%docker.kafka.bootstrap.servers=kafka:9092
%prod.kafka.bootstrap.servers=localhost:9092

mp.messaging.incoming.vehicle-registered-in.connector=smallrye-kafka
mp.messaging.incoming.vehicle-registered-in.topic=vehicle-registered
mp.messaging.incoming.vehicle-registered-in.group.id=billing-service
mp.messaging.incoming.vehicle-registered-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.vehicle-registered-in.auto.offset.reset=earliest

# Cap.9 - Retry de processamento: redelivery não bloqueante via retry topics.
mp.messaging.incoming.vehicle-registered-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.topics=vehicle-registered-retry_1000,vehicle-registered-retry_5000,vehicle-registered-retry_15000
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.timeout=30000

# Cap.9 - Dead-letter (ADR 003): após o esgotamento dos retries, o record vai para
# vehicle-registered-dlq em vez de ser abandonado (SmallRye 4.37.0, `dead-letter-queue.topic`).
mp.messaging.incoming.vehicle-registered-in.dead-letter-queue.topic=vehicle-registered-dlq

# Cap.9 (fluxo de cobrança, ADR 004/005) - ReservationConfirmed -> fatura DRAFT
mp.messaging.incoming.reservation-confirmed-in.connector=smallrye-kafka
mp.messaging.incoming.reservation-confirmed-in.topic=reservation-confirmed
mp.messaging.incoming.reservation-confirmed-in.group.id=billing-service
mp.messaging.incoming.reservation-confirmed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.reservation-confirmed-in.auto.offset.reset=earliest
mp.messaging.incoming.reservation-confirmed-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.reservation-confirmed-in.delayed-retry-topic.topics=reservation-confirmed-retry_1000,reservation-confirmed-retry_5000,reservation-confirmed-retry_15000
mp.messaging.incoming.reservation-confirmed-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.reservation-confirmed-in.delayed-retry-topic.timeout=30000
mp.messaging.incoming.reservation-confirmed-in.dead-letter-queue.topic=reservation-confirmed-dlq

# Cap.9 (fluxo de cobrança, ADR 004/005) - RentalCompleted -> fatura OPEN
mp.messaging.incoming.rental-completed-in.connector=smallrye-kafka
mp.messaging.incoming.rental-completed-in.topic=rental-completed
mp.messaging.incoming.rental-completed-in.group.id=billing-service
mp.messaging.incoming.rental-completed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.rental-completed-in.auto.offset.reset=earliest
mp.messaging.incoming.rental-completed-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.rental-completed-in.delayed-retry-topic.topics=rental-completed-retry_1000,rental-completed-retry_5000,rental-completed-retry_15000
mp.messaging.incoming.rental-completed-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.rental-completed-in.delayed-retry-topic.timeout=30000
mp.messaging.incoming.rental-completed-in.dead-letter-queue.topic=rental-completed-dlq
