quarkus.http.host=0.0.0.0
quarkus.http.port=${BILLING_PORT:8084}
%test.quarkus.http.test-port=0
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/billing/q/openapi

quarkus.datasource.db-kind=postgresql
# %dev: porta fixa (5432 com o primeiro digito duplicado, distinct da do
# reservation-service para os dois rodarem juntos). Fora do %dev a porta fica
# aleatoria: o %test precisa disso para dois builds nao disputarem a mesma.
%dev.quarkus.datasource.devservices.port=55433
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/billing
%prod.quarkus.datasource.username=billing
%prod.quarkus.datasource.password=billing
%docker.quarkus.datasource.reactive.url=vertx-reactive:postgresql://billing-postgres:5432/billing
%docker.quarkus.datasource.username=billing
%docker.quarkus.datasource.password=billing
quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Cap.9 - Kafka via SmallRye Reactive Messaging.
# Em dev NAO ha bootstrap: o Kafka Dev Service do Quarkus (3.39.3) sobe um broker
# compartilhado entre os servicos que usam Kafka, com porta fixa 39092 (prefixo 3
# da 9092) para poder inspecionar com CLI. Duplicar o primeiro digito da 9092
# daria 99092, que e invalido (teto de porta = 65535). Em %test quem provide o
# broker e o KafkaCompanionResource, entao o Dev Service fica desligado. Containers
# (%docker) e jar no host (%prod) falam com o broker do compose (others/docker-compose.yml),
# que anuncia 2 listeners: INTERNAL kafka:29092 e EXTERNAL localhost:9092.
%dev.quarkus.kafka.devservices.port=39092
%test.quarkus.kafka.devservices.enabled=false
%docker.kafka.bootstrap.servers=kafka:29092
%prod.kafka.bootstrap.servers=localhost:9092

# Topicos do broker de dev: evento + retries (1s/5s/15s) + DLQ de cada canal
# (ADR 002/003), espelhando o que o kafka-init provisiona no compose.
%dev.quarkus.kafka.devservices.topic-partitions.vehicle-registered=1
%dev.quarkus.kafka.devservices.topic-partitions.vehicle-registered-retry_1000=1
%dev.quarkus.kafka.devservices.topic-partitions.vehicle-registered-retry_5000=1
%dev.quarkus.kafka.devservices.topic-partitions.vehicle-registered-retry_15000=1
%dev.quarkus.kafka.devservices.topic-partitions.vehicle-registered-dlq=1
%dev.quarkus.kafka.devservices.topic-partitions.reservation-confirmed=1
%dev.quarkus.kafka.devservices.topic-partitions.reservation-confirmed-retry_1000=1
%dev.quarkus.kafka.devservices.topic-partitions.reservation-confirmed-retry_5000=1
%dev.quarkus.kafka.devservices.topic-partitions.reservation-confirmed-retry_15000=1
%dev.quarkus.kafka.devservices.topic-partitions.reservation-confirmed-dlq=1
%dev.quarkus.kafka.devservices.topic-partitions.rental-completed=1
%dev.quarkus.kafka.devservices.topic-partitions.rental-completed-retry_1000=1
%dev.quarkus.kafka.devservices.topic-partitions.rental-completed-retry_5000=1
%dev.quarkus.kafka.devservices.topic-partitions.rental-completed-retry_15000=1
%dev.quarkus.kafka.devservices.topic-partitions.rental-completed-dlq=1
%dev.quarkus.kafka.devservices.topic-partitions.invoice-opened=1

mp.messaging.incoming.vehicle-registered-in.connector=smallrye-kafka
mp.messaging.incoming.vehicle-registered-in.topic=vehicle-registered
mp.messaging.incoming.vehicle-registered-in.group.id=billing-service
mp.messaging.incoming.vehicle-registered-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.vehicle-registered-in.auto.offset.reset=earliest
mp.messaging.incoming.vehicle-registered-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.topics=vehicle-registered-retry_1000,vehicle-registered-retry_5000,vehicle-registered-retry_15000
%test.mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.topics=vehicle-registered-retry_50,vehicle-registered-retry_100,vehicle-registered-retry_200
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.vehicle-registered-in.delayed-retry-topic.timeout=30000
mp.messaging.incoming.vehicle-registered-in.dead-letter-queue.topic=vehicle-registered-dlq

