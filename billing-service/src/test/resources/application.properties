%test.quarkus.scheduler.enabled=false

# Cap.9 - Kafka integration test for delayed retry.
mp.messaging.incoming.retry-test-in.connector=smallrye-kafka
mp.messaging.incoming.retry-test-in.topic=retry-test
mp.messaging.incoming.retry-test-in.group.id=retry-test-group
mp.messaging.incoming.retry-test-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.retry-test-in.auto.offset.reset=earliest
mp.messaging.incoming.retry-test-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.retry-test-in.delayed-retry-topic.topics=retry-test-retry_50,retry-test-retry_100,retry-test-retry_200
mp.messaging.incoming.retry-test-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.retry-test-in.delayed-retry-topic.timeout=30000

# Cap.9 - Exhaustion test: retry is abandoned after max-retries.
mp.messaging.incoming.retry-exhaustion-in.connector=smallrye-kafka
mp.messaging.incoming.retry-exhaustion-in.topic=retry-exhaustion
mp.messaging.incoming.retry-exhaustion-in.group.id=retry-exhaustion-group
mp.messaging.incoming.retry-exhaustion-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.retry-exhaustion-in.auto.offset.reset=earliest
mp.messaging.incoming.retry-exhaustion-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.retry-exhaustion-in.delayed-retry-topic.topics=retry-exhaustion-retry_50,retry-exhaustion-retry_100,retry-exhaustion-retry_200
mp.messaging.incoming.retry-exhaustion-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.retry-exhaustion-in.delayed-retry-topic.timeout=30000

# Cap.9 - Dead-letter (ADR 003)
mp.messaging.incoming.dlq-test-in.connector=smallrye-kafka
mp.messaging.incoming.dlq-test-in.topic=dlq-test
mp.messaging.incoming.dlq-test-in.group.id=dlq-test-group
mp.messaging.incoming.dlq-test-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dlq-test-in.auto.offset.reset=earliest
mp.messaging.incoming.dlq-test-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.dlq-test-in.delayed-retry-topic.topics=dlq-test-retry_50,dlq-test-retry_100,dlq-test-retry_200
mp.messaging.incoming.dlq-test-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.dlq-test-in.delayed-retry-topic.timeout=30000
mp.messaging.incoming.dlq-test-in.dead-letter-queue.topic=dlq-test-dlq

# BillingFlowKafkaIntegrationTest uses production-like retry/DLQ configuration.

# Cap.9 - End-to-end transactional inbox + delayed retry integration test.
mp.messaging.incoming.transactional-inbox-retry-test-in.connector=smallrye-kafka
mp.messaging.incoming.transactional-inbox-retry-test-in.topic=transactional-inbox-retry-test
