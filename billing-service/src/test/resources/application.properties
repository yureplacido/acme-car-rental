# Cap.9 - Kafka integration test for delayed retry.
mp.messaging.incoming.retry-test-in.connector=smallrye-kafka
mp.messaging.incoming.retry-test-in.topic=retry-test
mp.messaging.incoming.retry-test-in.group.id=retry-test-group
mp.messaging.incoming.retry-test-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.retry-test-in.auto.offset.reset=earliest
mp.messaging.incoming.retry-test-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.retry-test-in.delayed-retry-topic.topics=retry-test-retry-1000,retry-test-retry-5000,retry-test-retry-15000
mp.messaging.incoming.retry-test-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.retry-test-in.delayed-retry-topic.timeout=30000
