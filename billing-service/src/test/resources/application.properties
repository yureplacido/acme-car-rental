# Cap.9 - Kafka integration test for delayed retry.
mp.messaging.incoming.retry-test-in.connector=smallrye-kafka
mp.messaging.incoming.retry-test-in.topic=retry-test
mp.messaging.incoming.retry-test-in.group.id=retry-test-group
mp.messaging.incoming.retry-test-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.retry-test-in.auto.offset.reset=earliest
mp.messaging.incoming.retry-test-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.retry-test-in.delayed-retry-topic.topics=retry-test-retry_1000,retry-test-retry_5000,retry-test-retry_15000
mp.messaging.incoming.retry-test-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.retry-test-in.delayed-retry-topic.timeout=30000


# Cap.9 - Corrupt-event retry: unextractable events must flow through the
# delayed-retry policy (decorator passthrough) before being abandoned.
mp.messaging.incoming.corrupt-test-in.connector=smallrye-kafka
mp.messaging.incoming.corrupt-test-in.topic=corrupt-test
mp.messaging.incoming.corrupt-test-in.group.id=corrupt-test-group
mp.messaging.incoming.corrupt-test-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.corrupt-test-in.auto.offset.reset=earliest
mp.messaging.incoming.corrupt-test-in.failure-strategy=delayed-retry-topic
mp.messaging.incoming.corrupt-test-in.delayed-retry-topic.topics=corrupt-test-retry_1000,corrupt-test-retry_5000,corrupt-test-retry_15000
mp.messaging.incoming.corrupt-test-in.delayed-retry-topic.max-retries=3
mp.messaging.incoming.corrupt-test-in.delayed-retry-topic.timeout=30000

