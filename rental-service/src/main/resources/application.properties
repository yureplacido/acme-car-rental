quarkus.http.host=0.0.0.0
quarkus.http.port=${RENTAL_PORT:8082}
quarkus.swagger-ui.always-include=true
# OpenAPI no prefixo do gateway (traefik encaminha sem strip) p/ o agregador.
quarkus.smallrye-openapi.path=/rental/q/openapi

# Cap.7.6 - MongoDB via Panache (active record).
# Sem connection-string em dev/test: Dev Services sobe um MongoDB zerado em container.
# %dev: porta fixa. 27017 nao cabe na regra do primeiro digito duplicado
# (2|7017 -> 227017 passa de 65535), entao usa-se 3 + 7017 = 37017.
# Fora do %dev a porta fica aleatoria: o %test precisa disso para dois builds
# ao mesmo tempo nao disputarem a mesma porta.
quarkus.mongodb.database=rental
%dev.quarkus.mongodb.devservices.port=37017
%prod.quarkus.mongodb.connection-string=mongodb://mongo:27017
%docker.quarkus.mongodb.connection-string=mongodb://rental-mongo:27017
# O pom tem quarkus-messaging-kafka (para o cap.10), mas este servico ainda nao
# declara nenhum canal. Sem isso o Kafka Dev Service subiria um broker de graca
# aqui, com porta aleatoria, e as demais servicos poderiam herdar essa porta
# no lugar da fixa 39092.
%dev.quarkus.kafka.devservices.enabled=false
