quarkus.http.host=0.0.0.0
quarkus.http.port=${RENTAL_PORT:8082}
# Cap.10 item 9 - nome pelo qual os demais servicos (reservation) encontram este no Consul.
quarkus.application.name=rentals
quarkus.swagger-ui.always-include=true
# OpenAPI no prefixo do gateway (traefik encaminha sem strip) p/ o agregador.
quarkus.smallrye-openapi.path=/rental/q/openapi

# Cap.7.6 - MongoDB via Panache (active record).
# Sem connection-string em dev/test: Dev Services sobe um MongoDB zerado em container.
# %dev: porta fixa. 27017 nao cabe na regra do primeiro digito duplicado
# (2|7017 -> 227017 passa de 65535), entao usa-se 3 + 7017 = 37017.
# Fora do %dev a porta fica aleatoria: o %test precisa disso para dois builds
# ao mesmo tempo nao disputarem a mesma porta.
quarkus.mongodb.database=rental
%dev.quarkus.mongodb.devservices.port=37017
%prod.quarkus.mongodb.connection-string=mongodb://mongo:27017
%docker.quarkus.mongodb.connection-string=mongodb://rental-mongo:27017
# O pom tem quarkus-messaging-kafka (para o cap.10), mas este servico ainda nao
# declara nenhum canal. Sem isso o Kafka Dev Service subiria um broker de graca
# aqui, com porta aleatoria, e as demais servicos poderiam herdar essa porta
# no lugar da fixa 39092.
%dev.quarkus.kafka.devservices.enabled=false

# Cap.10 item 9 - o rental-service se publica no Consul como "rentals" (mesmo nome que
# o reservation-service procura em stork://rentals) atraves do adapter proprio de registro
# (ConsulServiceRegistration): o auto-registro do Stork registrar 3.39.3 registra
# health-check-url relativo que o Consul marca critical e o deregister roda apos o CDI
# fechado (ver docs/knowledge/14-cloud-native-patterns.md secao 1.7). Fora de %test fica
# ligado, com o Consul no host default (localhost:8500); em %test um teste dedicado
# (RentalRegistersInConsulTest) o religa com um Consul real e assere o check passing.
acme.consul.registration.enabled=true
%docker.acme.consul.registration.consul-host=consul
%test.acme.consul.registration.enabled=false
# Cap.10 item 10 - em Kubernetes quem publica e a plataforma (Service + probe),
# nao o app (ADR 011): desliga o registro Consul no perfil %kubernetes.
%kubernetes.acme.consul.registration.enabled=false
