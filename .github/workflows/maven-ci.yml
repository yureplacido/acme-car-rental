name: Maven CI

# This workflow is intentionally not triggered by every feature-branch push.
# Our development loop is:
#   1. Implement
#   2. Validate locally (./mvnw test / ./mvnw verify)
#   3. Commit and push
#   4. Run CI manually when the change is ready for remote validation
#
# We still run automatically when code reaches main, so main remains protected
# by a final CI check.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      # Run once when a PR is opened or becomes ready for review.
      # Later pushes do not automatically start another full matrix.
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - inventory-service
          - reservation-service
          - rental-service
          - users-service
          - billing-service
          - inventory-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install inventory contract
        if: matrix.module == 'inventory-service' || matrix.module == 'inventory-cli'
        working-directory: inventory-proto
        run: ./mvnw install -DskipTests

      - name: Test module
        working-directory: ${{ matrix.module }}
        run: ./mvnw test
