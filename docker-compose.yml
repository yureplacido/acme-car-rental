name: acme-car-rental

services:
  traefik:
    image: traefik:v3.3
    container_name: acme-traefik
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --log.level=INFO
    ports:
      - "${GATEWAY_PORT:-8090}:80"
      - "${DASHBOARD_PORT:-8095}:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  swagger:
    image: nginx:1.27-alpine
    container_name: acme-swagger
    restart: unless-stopped
    volumes:
      - ./swagger:/usr/share/nginx/html:ro

  users-service:
    profiles: ["docker"]
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: users-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${USER_SERVICE_PORT:-8080}:${USER_SERVICE_PORT:-8080}"

  reservation-service:
    profiles: ["docker"]
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${RESERVATION_PORT:-8081}:${RESERVATION_PORT:-8081}"

  rental-service:
    profiles: ["docker"]
    build:
      context: ./rental-service
      dockerfile: Dockerfile
    container_name: rental-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${RENTAL_PORT:-8082}:${RENTAL_PORT:-8082}"

  inventory-service:
    profiles: ["docker"]
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${INVENTORY_PORT:-8083}:${INVENTORY_PORT:-8083}"

  billing-service:
    profiles: ["docker"]
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    env_file:
      - .env
    environment:
      QUARKUS_PROFILE: docker
    ports:
      - "${BILLING_PORT:-8084}:${BILLING_PORT:-8084}"

  # Cap.6.4 - Keycloak + PostgreSQL para o modo produção (realm importado no boot).
  postgres:
    container_name: acme-postgres
    image: docker.io/library/postgres:14
    restart: always
    profiles: ["docker"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - keycloak_network

  keycloak:
    container_name: acme-keycloak
    image: quay.io/keycloak/keycloak:25.0.6
    restart: always
    profiles: ["docker"]
    volumes:
      - "./keycloak/car-rental-realm.json:/opt/keycloak/data/import/car-rental-realm.json:ro"
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "${KEYCLOAK_PORT:-7777}:8080"
    depends_on:
      - postgres
    networks:
      - keycloak_network

networks:
  keycloak_network:
    driver: bridge