quarkus.http.host=0.0.0.0
quarkus.http.port=${USER_SERVICE_PORT:8080}
quarkus.swagger-ui.always-include=true
# root-path=/users deriva o OpenAPI p/ /users/q/openapi (non-application, fora da
# auth obrigatoria) e casa com o prefixo /users do traefik no agregador.
quarkus.http.root-path=/users

# Cap.6.2.2 - REST client p/ o reservation-service (URL sobrescreve o baseUrl)
quarkus.rest-client.reservations.url=${RESERVATIONS_SERVICE_URL:http://localhost:8081}
%docker.quarkus.rest-client.reservations.url=http://reservation-service:8081

# Cap.6 - Security (OIDC/Keycloak via Dev Services). Web app: Authorization Code Flow.
quarkus.oidc.application-type=web_app
quarkus.oidc.logout.path=/logout
quarkus.http.auth.permission.all-resources.paths=/*
quarkus.http.auth.permission.all-resources.policy=authenticated
# OpenAPI do agregador fica fora do login (caminho especifico vence o /*).
quarkus.http.auth.permission.openapi.paths=/users/q/openapi
quarkus.http.auth.permission.openapi.policy=permit

# Cap.6.4 - modo produção: o Keycloak é gerenciado manualmente (compose local,
# realm car-rental). %prod vale para o pacote (java -jar); %docker para rodar
# o container do serviço na mesma rede do compose (porta interna do Keycloak).
%prod.quarkus.oidc.auth-server-url=http://localhost:${KEYCLOAK_PORT:7777}/realms/car-rental
%prod.quarkus.oidc.client-id=users-service
%prod.quarkus.oidc.token-state-manager.split-tokens=true
%docker.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/car-rental
%docker.quarkus.oidc.client-id=users-service
%docker.quarkus.oidc.token-state-manager.split-tokens=true