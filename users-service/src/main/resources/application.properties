quarkus.http.host=0.0.0.0
quarkus.http.port=${USER_SERVICE_PORT:8080}
quarkus.swagger-ui.always-include=true
# root-path=/users deriva o OpenAPI p/ /users/q/openapi (non-application, fora da
# auth obrigatoria) e casa com o prefixo /users do traefik no agregador.
quarkus.http.root-path=/users

# Cap.10 pendente - graceful shutdown: aguarda requisicoes HTTP em voo terminarem antes de
# encerrar o processo (guia oficial Lifecycle, 3.39).
quarkus.shutdown.timeout=30s

# Cap.10.6 (item 9) - service discovery: o cliente so conhece o nome do servico
# (stork://reservations); host e porta vem do Consul, nao da configuracao. Fora do
# %docker vale o default do Stork (localhost:8500), que e onde o compose sobe o Consul.
quarkus.rest-client.reservations.url=stork://reservations
quarkus.stork.reservations.service-discovery.type=consul
# Cap.10 divida (ADR 009, secao 6): o BFF chamava o reservation-service sem prazo, segurando
# thread ate ~9s no caminho de falha (retry de leitura do outro lado). connect-timeout curto e
# read-timeout de 3s limitam a espera do BFF; estourar o prazo cai no mesmo inconclusivo do 503.
# Os prazos ficam NO CLIENTE DE LEITURA, nao no `reservations`: `quarkus.rest-client.<configKey>.read-timeout`
# e por cliente, e a escrita `POST /reservations` (create) nao e idempotente (ADR 009) - um prazo
# curto ali a transformaria em escrita de resultado incerto. Guarda em
# ReservationsRestGatewayTest.shouldNotPutTheAvailabilityDeadlineOnTheNonIdempotentWrite.
# Nota: o read-timeout e inatividade com rearmamento (nao deadline absoluto), a mesma limitacao
# ja documentada no reservation-service.
quarkus.rest-client.reservations-availability.url=stork://reservations
quarkus.rest-client.reservations-availability.connect-timeout=500
quarkus.rest-client.reservations-availability.read-timeout=3000
%docker.quarkus.stork.reservations.service-discovery.consul-host=consul
# Cap.10 item 10 (roadmap item 10) - discovery via Kubernetes: no cluster as
# instancias "reservations" sao um Service/Endpoints do K8s, nao consul catalog;
# o namespace vem de env (Rancher/Deployments itens 11/12) com default para dev/tests.
%kubernetes.quarkus.stork.reservations.service-discovery.type=kubernetes
%kubernetes.quarkus.stork.reservations.service-discovery.k8s-namespace=${K8S_NAMESPACE:default}
# sem Consul local nos testes ja que o %kubernetes nao usa catalog de registro.
quarkus.kubernetes-client.devservices.enabled=false
# Cap.6 - Security (OIDC/Keycloak via Dev Services). Web app: Authorization Code Flow.
quarkus.oidc.application-type=web_app
# %dev: porta fixa para o console do Keycloak ficar em URL estavel. Nao da
# para duplicar o primeiro digito da 8180 (88180 > 65535, porta maxima), entao
# usa-se o prefixo 3: 38180. Fora do %dev a porta fica aleatoria.
%dev.quarkus.keycloak.devservices.port=38180
quarkus.oidc.logout.path=/logout
quarkus.http.auth.permission.all-resources.paths=/*
quarkus.http.auth.permission.all-resources.policy=authenticated
# OpenAPI do agregador fica fora do login (caminho especifico vence o /*).
quarkus.http.auth.permission.openapi.paths=/users/q/openapi
quarkus.http.auth.permission.openapi.policy=permit
# Health endpoints must remain publicly probeable during tests without starting the OIDC web flow.
%test.quarkus.http.auth.permission.health.paths=q/health/*
%test.quarkus.http.auth.permission.health.policy=permit
# Cap.10 divida (ADR 009): /available e testado via HTTP sem o fluxo web de OIDC. Fora do
# %test o endpoint segue exigindo login (permissoes especificas vencem o /* acima).
%test.quarkus.http.auth.permission.available.paths=available
%test.quarkus.http.auth.permission.available.policy=permit
# Cap.6.4 - modo produção: o Keycloak é gerenciado manualmente (compose local,
# realm car-rental). %prod vale para o pacote (java -jar); %docker para rodar
# o container do serviço na mesma rede do compose (porta interna do Keycloak).
%prod.quarkus.oidc.auth-server-url=http://localhost:${KEYCLOAK_PORT:7777}/realms/car-rental
%prod.quarkus.oidc.client-id=users-service
%prod.quarkus.oidc.token-state-manager.split-tokens=true
%docker.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/car-rental
%docker.quarkus.oidc.client-id=users-service
%docker.quarkus.oidc.token-state-manager.split-tokens=true
# Cap.11 item 11.1 - config externalizada por ambiente: a mesma imagem, em cluster,
# fala com o Keycloak do cluster (Service chamado keycloak; o DNS real fica para o 11.6).
%kubernetes.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/car-rental
%kubernetes.quarkus.oidc.client-id=users-service
%kubernetes.quarkus.oidc.token-state-manager.split-tokens=true

# Cap.11 item 11.2 - quarkus-kubernetes extension: ativa o profile kubernetes no runtime
# do cluster e configura a imagem de forma declarativa.
quarkus.kubernetes.env.vars.QUARKUS_PROFILE=kubernetes
quarkus.kubernetes.image.group=acme
quarkus.kubernetes.image.name=users-service
quarkus.kubernetes.image.registry=docker.io
quarkus.container-image.tag=${project.version}
quarkus.container-image.group=acme
quarkus.container-image.name=users-service