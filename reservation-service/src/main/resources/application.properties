quarkus.http.host=0.0.0.0
quarkus.http.port=${RESERVATION_PORT:8081}
# Teste (@QuarkusTest) em porta aleatória: isola do dev (8081) e evita colisão entre execuções.
%test.quarkus.http.test-port=0
quarkus.swagger-ui.always-include=true
# OpenAPI no prefixo do gateway (traefik encaminha sem strip) p/ o agregador.
quarkus.smallrye-openapi.path=/reservations/q/openapi

# Cap.6.2.1: serviço REST protegido por OIDC (Bearer). Acesso anônimo permitido
# (sem Authorization header), por isso não há permission.* obrigatório aqui.
quarkus.oidc.application-type=service

# %dev: porta fixa (prefixo 3 da 8180; 88180 passaria de 65535). Distinta da
# do users-service porque os dois servicos tem config de OIDC diferente (web_app x
# service) e, portanto, Dev Services diferentes nao podem disputar a porta.
%dev.quarkus.keycloak.devservices.port=38181

# Cap.6.4 - modo produção: Keycloak gerenciado manualmente (compose local).
%prod.quarkus.oidc.auth-server-url=http://localhost:${KEYCLOAK_PORT:7777}/realms/car-rental
%prod.quarkus.oidc.client-id=reservation-service
%docker.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/car-rental
%docker.quarkus.oidc.client-id=reservation-service

# Cap.7.1/7.7 - Hibernate Reactive sobre PostgreSQL.
# Sem URL em dev/test: Dev Services sobe um Postgres zerado em container.
# %dev: porta fixa (5432 com o primeiro digito duplicado) para DBeaver/CLI.
# Fora do %dev a porta fica aleatoria: o %test precisa disso para dois builds
# ao mesmo tempo nao disputarem a mesma porta.
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.port=55432
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/reservation
%prod.quarkus.datasource.username=reservation
%prod.quarkus.datasource.password=reservation
%docker.quarkus.datasource.reactive.url=vertx-reactive:postgresql://reservation-postgres:5432/reservation
%docker.quarkus.datasource.username=reservation
%docker.quarkus.datasource.password=reservation
quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.rest-client."org.acme.reservation.adapter.out.rental.RentalClient".uri=${RENTAL_SERVICE_URL:http://localhost:8082}
# Prazo do transporte da escrita, sempre menor que RentalRestGateway.WRITE_DEADLINE_MILLIS:
# o @Timeout do SmallRye FT nao cancela a chamada em voo, entao quem aborta o request HTTP e este
# prazo (padrao do Quarkus seria 30s de leitura e 15s de conexao, bem acima do deadline de FT).
# RentalRestGatewayFaultToleranceTest checa essa relacao.
quarkus.rest-client."org.acme.reservation.adapter.out.rental.RentalClient".connect-timeout=500
quarkus.rest-client."org.acme.reservation.adapter.out.rental.RentalClient".read-timeout=1500
%docker.quarkus.rest-client."org.acme.reservation.adapter.out.rental.RentalClient".uri=http://rental-service:8082
quarkus.smallrye-graphql-client.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8083}/graphql
%docker.quarkus.smallrye-graphql-client.inventory.url=http://inventory-service:8083/graphql

# Cap.10 item 8 - fault tolerance na fronteira de saida (ADR 009).
# A politica (o que e timeout, o que e retry, o que vira indisponibilidade) esta nas
# annotations dos adapters de saida. Aqui so o prazo, que e operacional por ambiente.
#
# ATENCAO: `timeout.value` SEM `timeout.unit` herda a unidade da annotation @Timeout (cujo padrao
# e MILIS). Como a unidade da annotation e escolha nossa, o mesmo numero muda de significado
# conforme ela - 300 pode valer 300ms ou 300s (medido nas duas). Por isso `timeout.unit` vem
# sempre explicito aqui. As classes de teste medem o tempo decorrido com limites bilaterais e
# @Timeout de classe, entao uma chave errada (ou sem unidade) falha em segundos em vez de passar
# em silencio ou arrastar a suite por minutos.
#
# Em %prod a leitura de disponibilidade e mais folgada que a escrita porque o retry e de
# leitura (idempotente) e o resultado final e 503, nunca confirmacao de reserva.
#
# A escrita NAO tem override por perfil: um unico deadline (2s, em RentalRestGateway) vale para
# todos, porque ele precisa ficar acima do prazo de transporte da chamada HTTP - e um teste de
# guarda compara os dois. Se cada perfil tivesse o seu, essa relacao so existiria em %prod.
%prod.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".timeout.value=3
%prod.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".timeout.unit=SECONDS

# %test: mesmas annotations com prazo curto, para o cenario de falha rodar em milissegundos.
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".timeout.value=300
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".timeout.unit=MILLIS
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".retry.max-retries=2
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".retry.delay=10
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".retry.delay-unit=MILLIS
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".retry.jitter=0
%test.quarkus.fault-tolerance."org.acme.reservation.adapter.out.inventory.GraphQLInventoryGateway/findVehicles".retry.jitter-unit=MILLIS
