quarkus.http.host=0.0.0.0
quarkus.http.port=${RESERVATION_PORT:8081}
# Teste (@QuarkusTest) em porta aleatória: isola do dev (8081) e evita colisão entre execuções.
%test.quarkus.http.test-port=0
quarkus.swagger-ui.always-include=true
# OpenAPI no prefixo do gateway (traefik encaminha sem strip) p/ o agregador.
quarkus.smallrye-openapi.path=/reservations/q/openapi

# Cap.6.2.1: serviço REST protegido por OIDC (Bearer). Acesso anônimo permitido
# (sem Authorization header), por isso não há permission.* obrigatório aqui.
quarkus.oidc.application-type=service

# %dev: porta fixa (prefixo 3 da 8180; 88180 passaria de 65535). Distinta da
# do users-service porque os dois servicos tem config de OIDC diferente (web_app x
# service) e, portanto, Dev Services diferentes nao podem disputar a porta.
%dev.quarkus.keycloak.devservices.port=38181

# Cap.6.4 - modo produção: Keycloak gerenciado manualmente (compose local).
%prod.quarkus.oidc.auth-server-url=http://localhost:${KEYCLOAK_PORT:7777}/realms/car-rental
%prod.quarkus.oidc.client-id=reservation-service
%docker.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/car-rental
%docker.quarkus.oidc.client-id=reservation-service

# Cap.7.1/7.7 - Hibernate Reactive sobre PostgreSQL.
# Sem URL em dev/test: Dev Services sobe um Postgres zerado em container.
# %dev: porta fixa (5432 com o primeiro digito duplicado) para DBeaver/CLI.
# Fora do %dev a porta fica aleatoria: o %test precisa disso para dois builds
# ao mesmo tempo nao disputarem a mesma porta.
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.port=55432
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/reservation
%prod.quarkus.datasource.username=reservation
%prod.quarkus.datasource.password=reservation
%docker.quarkus.datasource.reactive.url=vertx-reactive:postgresql://reservation-postgres:5432/reservation
%docker.quarkus.datasource.username=reservation
%docker.quarkus.datasource.password=reservation
quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.rest-client."org.acme.reservation.adapter.out.rental.RentalClient".uri=${RENTAL_SERVICE_URL:http://localhost:8082}
%docker.quarkus.rest-client."org.acme.reservation.adapter.out.rental.RentalClient".uri=http://rental-service:8082
quarkus.smallrye-graphql-client.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8083}/graphql
%docker.quarkus.smallrye-graphql-client.inventory.url=http://inventory-service:8083/graphql