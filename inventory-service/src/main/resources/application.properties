quarkus.http.host=0.0.0.0
quarkus.http.port=${INVENTORY_PORT:8083}
quarkus.smallrye-graphql.ui.always-include=true

# Gera os stubs gRPC a partir do contrato org.acme:inventory-proto (fonte única).
quarkus.generate-code.grpc.scan-for-proto=org.acme:inventory-proto

# Reflection sempre ligada: permite grpcurl/Dev UI descobrirem os métodos sem proto local.
quarkus.grpc.server.enable-reflection-service=true

# Cap.8 - Hibernate Reactive + Panache + MySQL reativo.
# Sem URL em dev/test: Dev Services sobe um MySQL zerado em container.
# %dev: porta fixa (3306 com o primeiro digito duplicado) para DBeaver/CLI.
# Fora do %dev a porta fica aleatoria: o %test precisa disso para dois builds
# ao mesmo tempo nao disputarem a mesma porta.
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=user
quarkus.datasource.password=pass
%dev.quarkus.datasource.devservices.port=33306
%prod.quarkus.datasource.reactive.url=mysql://localhost:3306/inventory
%docker.quarkus.datasource.reactive.url=mysql://inventory-mysql:3306/inventory
quarkus.datasource.reactive.max-size=20

# drop and create as tabelas no boot (dev/test; import.sql pré-popula).
quarkus.hibernate-orm.database.generation=drop-and-create
# import.sql roda por padrao so em dev/test; forçamos tambem no prod/docker.
quarkus.hibernate-orm.sql-load-script=import.sql
inventory.bulk.max-concurrency=4


# Cap.9 - Kafka via SmallRye Reactive Messaging.
# Em dev NAO ha bootstrap: o Kafka Dev Service do Quarkus (3.39.3) sobe um broker
# compartilhado entre os servicos que usam Kafka, com porta fixa 39092 (prefixo 3
# da 9092) para poder inspecionar com CLI. Duplicar o primeiro digito da 9092
# daria 99092, que e invalido (teto de porta = 65535). Em %test quem provide o
# broker e o KafkaCompanionResource, entao o Dev Service fica desligado. Containers
# (%docker) e jar no host (%prod) falam com o broker do compose (others/docker-compose.yml),
# que anuncia 2 listeners: INTERNAL kafka:29092 e EXTERNAL localhost:9092.
%dev.quarkus.kafka.devservices.port=39092
%dev.quarkus.kafka.devservices.topic-partitions.vehicle-registered=1
%test.quarkus.kafka.devservices.enabled=false
%docker.kafka.bootstrap.servers=kafka:29092
%prod.kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.vehicle-registered-out.connector=smallrye-kafka
mp.messaging.outgoing.vehicle-registered-out.topic=vehicle-registered
mp.messaging.outgoing.vehicle-registered-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.vehicle-registered-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Cap.10 - tracing ponta a ponta (item 7).
# A propagacao de contexto via headers Kafka e automatica quando o extension
# quarkus-opentelemetry esta presente (guia Quarkus "Messaging", secao OpenTelemetry
# Tracing): mensagens de saida propagam o span corrente e mensagens de entrada
# herdam o span do record como pai. Nenhum codigo de dominio ou adapter muda; o
# contexto viaja no header traceparent, nunca no payload. Em dev, o Dev Service
# LGTM (Grafana+Tempo) sobe automaticamente para visualizar os traces. Em %test o
# exporter OTLP fica desligado e o exporter CDI em memoria (bean de teste) recebe
# os spans; simple=true exporta na hora, sem esperar o batch de 5s.
# quarkus.application.name e a identidade do servico: alimenta quarkus.otel.service.name
# (nome do servico nos traces) para todos os sinais.
quarkus.application.name=inventory-service
%test.quarkus.otel.exporter.otlp.enabled=false
%test.quarkus.otel.simple=true
# Em prod/docker nao ha collector OTLP no stack (deployment.md -> Observabilidade).
# Desligado para nao logar falhas de export contínuas; ao existir collector, definir
# quarkus.otel.exporter.otlp.endpoint (e remover os desligues abaixo).
%prod.quarkus.otel.exporter.otlp.enabled=false
%docker.quarkus.otel.exporter.otlp.enabled=false
