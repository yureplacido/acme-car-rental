quarkus.http.host=0.0.0.0
quarkus.http.port=${INVENTORY_PORT:8083}
quarkus.smallrye-graphql.ui.always-include=true

# Gera os stubs gRPC a partir do contrato org.acme:inventory-proto (fonte única).
quarkus.generate-code.grpc.scan-for-proto=org.acme:inventory-proto

# Reflection sempre ligada: permite grpcurl/Dev UI descobrirem os métodos sem proto local.
quarkus.grpc.server.enable-reflection-service=true

# Cap.8 - Hibernate Reactive + Panache + MySQL reativo.
# Sem URL em dev/test: Dev Services sobe um MySQL zerado em container.
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=user
quarkus.datasource.password=pass
%prod.quarkus.datasource.reactive.url=mysql://localhost:3306/inventory
%docker.quarkus.datasource.reactive.url=mysql://inventory-mysql:3306/inventory
quarkus.datasource.reactive.max-size=20

# drop and create as tabelas no boot (dev/test; import.sql pré-popula).
quarkus.hibernate-orm.database.generation=drop-and-create
# import.sql roda por padrao so em dev/test; forçamos tambem no prod/docker.
quarkus.hibernate-orm.sql-load-script=import.sql